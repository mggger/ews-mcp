<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Email</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, 'Microsoft YaHei', sans-serif;
            background-color: #f5f5f5;
            line-height: 1.6;
        }
        .email-container {
            max-width: 650px;
            margin: 0 auto;
            background-color: #ffffff;
        }
        .email-body {
            padding: 30px 40px;
            color: #333333;
            font-size: 15px;
        }
        .email-content {
            margin-bottom: 30px;
            min-height: 50px;
        }
        .email-content p {
            margin: 0 0 12px 0;
        }
        .email-content p:last-child {
            margin-bottom: 0;
        }
        .divider {
            height: 1px;
            background: linear-gradient(to right, transparent, #e0e0e0, transparent);
            margin: 30px 0 25px 0;
        }
        .signature-section {
            text-align: center;
            padding: 20px 0;
        }
        .signature-image {
            max-width: 180px;
            height: auto;
            display: block;
            margin: 0 auto;
            border-radius: 4px;
        }
        .footer-note {
            color: #999999;
            font-size: 12px;
            text-align: center;
            margin-top: 15px;
            padding: 0 20px;
        }
        /* 响应式设计 */
        @media only screen and (max-width: 600px) {
            .email-body {
                padding: 20px 25px;
            }
            .signature-image {
                max-width: 150px;
            }
        }
    </style>
</head>
<body>
    <div class="email-container">
        <div class="email-body">
            <!-- 邮件正文内容 -->
            <div class="email-content">
                {{EMAIL_CONTENT}}
            </div>
            
            <!-- 分隔线 -->
            <div class="divider"></div>
            
            <!-- 签名区域 -->
            <div class="signature-section">
                <img src="cid:mick_signature" alt="Signature" class="signature-image" />
            </div>
        </div>
    </div>
</body>
</html>
